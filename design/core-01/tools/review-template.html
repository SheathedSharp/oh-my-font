<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LihuiT / zayJu · Core 01 曲线样稿</title>
<style>
:root{color-scheme:light;--paper:#faf9f5;--ink:#171b1a;--sub:#606a65;--rule:#d8ddd6;--accent:#166854}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:1420px;margin:auto;padding:48px 5vw 80px}header{border-bottom:1px solid var(--rule);padding-bottom:24px}small,.eyebrow{color:var(--accent);letter-spacing:.13em;font-size:12px;font-weight:650}h1{font-weight:580;font-size:clamp(27px,4vw,44px);letter-spacing:-.025em;margin:10px 0}p{max-width:850px;color:var(--sub)}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:30px 0}button,select,input{font:inherit;border:1px solid var(--rule);border-radius:9px;background:transparent;color:inherit;padding:9px 14px}button{cursor:pointer}button[aria-pressed=true]{color:white;background:var(--accent);border-color:var(--accent)}select{max-width:100%}label{display:inline-flex;align-items:center;gap:8px}.typebox{display:block;width:100%;margin:14px 0;background:#fffefb}#warning{min-height:27px;color:#99372c;margin:10px 0}.stage{border-block:1px solid var(--rule);padding:25px 0;overflow:auto}.stage svg{height:var(--size,260px);width:auto;display:block;max-width:none}.caption{font-size:13px;color:var(--sub)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-top:30px}.tile{text-align:left;border:1px solid var(--rule);border-radius:12px;padding:14px 16px;background:#fffefb}.tile svg{height:180px;width:100%;display:block}.tile span{font-size:12px;color:var(--sub)}.details{margin-top:40px}.details h2{font-weight:560}.details .stage{--size:440px}footer{margin-top:46px;border-top:1px solid var(--rule);padding-top:22px;color:var(--sub);font-size:13px}a{color:var(--accent)}.handles{display:none}.nodes-on .handles{display:block}.outline-on .letter{fill:none;stroke:var(--ink);stroke-width:1.8;vector-effect:non-scaling-stroke}input[type=range]{padding:0;max-width:160px}input[type=checkbox]{accent-color:var(--accent)}@media(max-width:600px){main{padding:24px 20px 50px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile svg{height:145px}.details .stage{--size:320px}.controls{gap:8px}input[type=range]{max-width:105px}}
</style></head><body><main>
<header><div class="eyebrow">CORE 01 · 等待视觉验收</div><h1>LihuiT / zayJu 核心曲线样稿</h1><p>这次只讨论 11 个核心字形的性格与圆润程度。此页直接显示 UFO 曲线源，不调用替代字体；实际字体导出效果见同目录的 PNG 样张。尚未扩展其余字符、字重或斜体。</p></header>
<div class="controls"><button data-family="LihuiT" aria-pressed="true">LihuiT · 温润人文</button><button data-family="zayJu" aria-pressed="false">zayJu · 流动展示</button><label>大小 <input id="size" type="range" min="100" max="460" value="260" aria-label="预览大小"></label><label><input id="outline" type="checkbox">轮廓</label><label><input id="handles" type="checkbox">控制点</label></div>
<label for="sample">组合字样 · 仅支持 B M R a g e 2 3 6 8 9 和空格</label>
<input id="sample" class="typebox" value="Rage  Mega" spellcheck="false" aria-describedby="warning" aria-label="组合字样">
<div class="controls"><button data-text="Rage  Mega">Rage / Mega</button><button data-text="BMR age">BMR / age</button><button data-text="23689">数字</button></div>
<div id="warning" role="status" aria-live="polite"></div><div id="stage" class="stage" aria-label="曲线组合预览"></div>
<p class="caption">单参考切面。控制点可视化不会修改轮廓；后续逐字编辑以对应 UFO 中的 GLIF 为准。</p>
<div id="grid" class="grid"></div><section class="details"><h2 id="detail-title">B · 放大检查</h2><p id="detail-note"></p><div id="detail" class="stage"></div></section>
<footer>UFO3 为主源；同目录提供 Glyphs 编辑副本和 SVG。此样稿不是正式发版，工具检查也不代表视觉批准。<a href="overview.png">实际字体总览</a> · <a href="capitals.png">B / M / R 放大</a> · <a href="before-after.png">与被否决 PR #8 对照</a></footer>
</main><script type="application/json" id="data">__GLYPH_DATA__</script><script>
'use strict';const data=JSON.parse(document.getElementById('data').textContent);let family='LihuiT',selected='B';const ns='http://www.w3.org/2000/svg';
function el(tag,attrs={}){const node=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))node.setAttribute(k,String(v));return node}
function draw(value){const svg=el('svg',{role:'img','aria-label':family+' '+value});let x=0,prev=null;for(const ch of value){const item=data[family].paths[ch];if(!item)throw new Error('Unsupported glyph');if(prev){x+=data[family].kerning[prev+'/'+item.name]||0}const g=el('g',{transform:`translate(${x},800) scale(1,-1)`});g.appendChild(el('path',{class:'letter',d:item.d,fill:'currentColor'}));const h=el('g',{class:'handles'});for(const [a,b] of item.handles){h.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#c86636','stroke-width':1.2,'vector-effect':'non-scaling-stroke'}));h.appendChild(el('circle',{cx:b[0],cy:b[1],r:3,fill:'#c86636'}))}for(const p of item.nodes)h.appendChild(el('circle',{cx:p[0],cy:p[1],r:3.5,fill:'#166854'}));g.appendChild(h);svg.appendChild(g);x+=item.advance;prev=item.name}svg.setAttribute('viewBox',`0 0 ${Math.max(1,x)} 1080`);svg.style.aspectRatio=`${Math.max(1,x)}/1080`;return svg}
function detail(){document.getElementById('detail-title').textContent=family+' · '+selected+' · 放大检查';document.getElementById('detail-note').textContent=data[family].paths[selected].note;document.getElementById('detail').replaceChildren(draw(selected))}
function update(){const value=document.getElementById('sample').value;const missing=[...new Set([...value].filter(c=>!data[family].paths[c]))];document.getElementById('warning').textContent=missing.length?'未绘制字符：'+missing.join(' ')+'。已停止预览，未用其他字体代替。':'';const stage=document.getElementById('stage');stage.replaceChildren();if(!missing.length&&value)stage.appendChild(draw(value));detail()}
function grid(){const target=document.getElementById('grid');target.replaceChildren();for(const c of 'BMRage23689'){const b=document.createElement('button');b.className='tile';b.setAttribute('aria-label','放大 '+c);const label=document.createElement('span');label.textContent=c+' / '+data[family].paths[c].name;b.append(label,draw(c));b.addEventListener('click',()=>{selected=c;detail();document.getElementById('detail-title').scrollIntoView({behavior:'auto',block:'start'})});target.appendChild(b)}}
for(const b of document.querySelectorAll('[data-family]'))b.addEventListener('click',()=>{family=b.dataset.family;for(const other of document.querySelectorAll('[data-family]'))other.setAttribute('aria-pressed',String(other===b));grid();update()});for(const b of document.querySelectorAll('[data-text]'))b.addEventListener('click',()=>{document.getElementById('sample').value=b.dataset.text;update()});document.getElementById('sample').addEventListener('input',update);document.getElementById('size').addEventListener('input',e=>document.getElementById('stage').style.setProperty('--size',e.target.value+'px'));document.getElementById('handles').addEventListener('change',e=>document.body.classList.toggle('nodes-on',e.target.checked));document.getElementById('outline').addEventListener('change',e=>document.body.classList.toggle('outline-on',e.target.checked));grid();update();
</script></body></html>
