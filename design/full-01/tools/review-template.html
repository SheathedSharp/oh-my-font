<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LihuiT / zayJu · 全字符参考稿</title>
<style>:root{--paper:#faf9f5;--ink:#171b1a;--sub:#656e68;--line:#d8ddd6;--green:#176952}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:1450px;margin:auto;padding:34px 4vw 70px}h1{font-weight:580;font-size:clamp(25px,4vw,42px);letter-spacing:-.025em;margin:8px 0}p{color:var(--sub);max-width:1000px}.eyebrow{color:var(--green);font-size:12px;letter-spacing:.1em}header{border-bottom:1px solid var(--line);padding-bottom:20px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0}button,input,select{font:inherit;border:1px solid var(--line);background:transparent;color:inherit;border-radius:9px;padding:8px 13px}button{cursor:pointer}button[aria-pressed=true]{color:white;background:var(--green)}input{min-width:200px;max-width:100%;flex:1}label{display:flex;gap:7px;align-items:center}label input{min-width:0;flex:none}button:disabled{opacity:.4;cursor:default}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.tile{background:#fffefa;padding:12px;text-align:left;min-width:0}.tile small{display:block;color:var(--sub);font-size:11px;overflow-wrap:anywhere}.tile svg{height:138px;width:100%;display:block}.approved{color:var(--green)!important}.count{color:var(--sub);font-size:13px}#detail{margin:36px 0;border-block:1px solid var(--line);padding:25px 0}#large{height:380px;display:flex;justify-content:center;overflow:auto}#large svg{height:100%;max-width:100%;width:auto}.outline .glyph{fill:none;stroke:currentColor;stroke-width:2;vector-effect:non-scaling-stroke}.status{font-size:13px;color:var(--sub)}footer{border-top:1px solid var(--line);padding-top:20px;color:var(--sub);font-size:13px}a{color:var(--green)}@media(max-width:600px){main{padding:20px}#grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile svg{height:125px}#large{height:290px}.controls{gap:8px}input{min-width:150px}}</style></head><body><main>
<header><div class="eyebrow">FULL REFERENCE · 核心已验收 / 新增字符待最终审查</div><h1>LihuiT / zayJu 全字符参考稿</h1><p>每款 810 个编码字符、986 个字形；保留原有 945 个字形名，另有 41 个排版辅助与重音替代字形。此页显示可编辑 UFO 源轮廓，<strong>不是浏览器排版结果</strong>；实际字体文字、语言与功能效果见 PNG 样张。已验收核心的曲线和字宽保持锁定。</p></header>
<div class="controls"><button data-family="LihuiT" aria-pressed="true">LihuiT</button><button data-family="zayJu" aria-pressed="false">zayJu</button><input id="search" type="search" placeholder="字形名、单个字符或 U+0105" aria-label="搜索字形"><select id="kind" aria-label="字形分类"><option value="all">所有字形</option><option value="encoded">编码字符</option><option value="features">替代 / 辅助字形</option><option value="core">已验收核心</option></select><label><input id="outline" type="checkbox">轮廓</label></div>
<div class="controls"><button id="prev">上一页</button><button id="next">下一页</button><span id="count" class="count" role="status" aria-live="polite"></span></div><div id="grid"></div>
<section id="detail"><h2 id="title"></h2><p id="info"></p><div id="large"></div><p id="note"></p></section>
<footer>一款一个参考字重，本轮没有合成其他字重、斜体或替换正式版。组合附加符号通过可编辑组件与锚点复用新基础字形，而非复制旧字库。<a href="overview.png">实际字体总览</a> · <a href="atlas.md">全部导出字形图册</a> · <a href="LihuiT-features.png">LihuiT 功能</a> · <a href="zayJu-features.png">zayJu 功能</a></footer>
<script type="application/json" id="data">__GLYPH_DATA__</script><script>
'use strict';const data=JSON.parse(document.querySelector('#data').textContent);let family='LihuiT',page=0;const perPage=72,ns='http://www.w3.org/2000/svg';function make(tag,attrs){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs||{}))e.setAttribute(k,String(v));return e}function picture(g){const s=make('svg',{viewBox:`-120 -1380 ${Math.max(g.advance,420)+240} 1860`,role:'img','aria-label':family+' '+g.name});const p=make('path',{d:g.path,transform:'scale(1,-1)',fill:'currentColor',class:'glyph'});s.appendChild(p);return s}function detail(g){document.querySelector('#title').textContent=family+' / '+g.name;document.querySelector('#info').textContent=(g.codes.join(' ')||'无编码：替代或辅助字形')+' · advance '+g.advance+' · '+(g.approved_core?'已验收核心：曲线/字宽锁定':'新增字形：待最终视觉审查');document.querySelector('#note').textContent=g.note+(g.components.length?'  组件：'+g.components.join(' + '):'');document.querySelector('#large').replaceChildren(picture(g))}function render(){const query=document.querySelector('#search').value.trim().toLowerCase(),kind=document.querySelector('#kind').value;const rows=data[family].filter(g=>(!query||g.name.toLowerCase().includes(query)||g.codes.some(c=>c.toLowerCase().includes(query))||g.chars.includes(query))&&(kind==='all'||kind==='encoded'&&g.codes.length||kind==='features'&&!g.codes.length||kind==='core'&&g.approved_core));const pages=Math.max(1,Math.ceil(rows.length/perPage));page=Math.min(page,pages-1);const grid=document.querySelector('#grid');grid.replaceChildren();for(const g of rows.slice(page*perPage,(page+1)*perPage)){const b=document.createElement('button');b.className='tile';b.setAttribute('aria-label','查看 '+g.name);const name=document.createElement('small');name.textContent=g.name;const code=document.createElement('small');code.textContent=g.codes.join(' ')||'feature / helper';if(g.approved_core){name.className='approved';name.textContent+=' · 核心锁定'}b.append(name,picture(g),code);b.addEventListener('click',()=>{detail(g);document.querySelector('#detail').scrollIntoView({behavior:'auto',block:'start'})});grid.appendChild(b)}document.querySelector('#count').textContent=`${rows.length} 个字形 · ${page+1} / ${pages} 页`;document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=page===pages-1;if(rows.length)detail(rows[0]);else{document.querySelector('#title').textContent='未找到字形';document.querySelector('#info').textContent='此查询没有受支持的源字形，不使用替代字体。';document.querySelector('#large').replaceChildren();document.querySelector('#note').textContent=''}}for(const b of document.querySelectorAll('[data-family]'))b.addEventListener('click',()=>{family=b.dataset.family;page=0;for(const x of document.querySelectorAll('[data-family]'))x.setAttribute('aria-pressed',String(x===b));render()});document.querySelector('#search').addEventListener('input',()=>{page=0;render()});document.querySelector('#kind').addEventListener('change',()=>{page=0;render()});document.querySelector('#prev').addEventListener('click',()=>{page--;render()});document.querySelector('#next').addEventListener('click',()=>{page++;render()});document.querySelector('#outline').addEventListener('change',e=>document.body.classList.toggle('outline',e.target.checked));render();
</script></main></body></html>
